[versions]
kotlin = "2.4.20"
kotlinx-serialization = "1.11.0"
kotlin-code-generation = "0.5.2"

compose-html = "1.12.1"
kobweb = "0.25.1"
compose-runtime = "1.11.4"
jetbrains-compose = "1.12.1"

markdown = "0.7.15"

assertk = "0.28.1"

dokka = "2.2.0"
detekt = "2.0.0-alpha.6"

cdn-tabler-core = "1.6.0"
cdn-tabler-icons = "3.46.0"
# Uncomment this line and comment out the release version below to verify main-SNAPSHOT.
tabweb = "main-SNAPSHOT"
#tabweb = "0.0.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

bom-kotlin-code-generation = { module = "io.toolisticon.kotlin.generation:kotlin-code-generation-bom", version.ref = "kotlin-code-generation" }

compose-html-core = { module = "org.jetbrains.compose.html:html-core", version.ref = "compose-html" }
compose-html-test-utils = { module = "org.jetbrains.compose.html:html-test-utils", version.ref = "compose-html" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-runtime" }
kobweb-api = { module = "com.varabyte.kobweb:kobweb-api", version.ref = "kobweb" }
kobweb-core = { module = "com.varabyte.kobweb:kobweb-core", version.ref = "kobweb" }
kobweb-compose-js = { module = "com.varabyte.kobweb:kobweb-compose-js", version.ref = "kobweb" }
kobweb-worker = { module = "com.varabyte.kobweb:kobweb-worker", version.ref = "kobweb" }
kobwebx-markdown = { module = "com.varabyte.kobwebx:kobwebx-markdown", version.ref = "kobweb" }
kobwebx-serialization-kotlinx = { module = "com.varabyte.kobwebx:kobwebx-serialization-kotlinx", version.ref = "kobweb" }
tabweb = { module = "com.github.jangalinski:tabweb", version.ref = "tabweb" }

jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "markdown" }
kotlin-code-generation = { module = "io.toolisticon.kotlin.generation:kotlin-code-generation" }

test-assertk = { module = "com.willowtreeapps.assertk:assertk", version.ref = "assertk" }
detekt-api = { module = "dev.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "dev.detekt:detekt-test", version.ref = "detekt" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinx-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }

detekt = { id = "dev.detekt", version.ref = "detekt" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

kobweb-application = { id = "com.varabyte.kobweb.application", version.ref = "kobweb" }
kobweb-library = { id = "com.varabyte.kobweb.library", version.ref = "kobweb" }
kobweb-worker = { id = "com.varabyte.kobweb.worker", version.ref = "kobweb" }
kobwebx-markdown = { id = "com.varabyte.kobwebx.markdown", version.ref = "kobweb" }
