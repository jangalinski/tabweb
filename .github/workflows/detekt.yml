name: Detekt

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  detekt:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version-file: .java-version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Evaluate library rules
        id: detekt
        continue-on-error: true
        run: >
          ./gradlew
          :lib:detektJsMainSourceSet
          -PtabwebDetekt.strict=true
          --no-daemon
          --console=plain

      - name: Upload Detekt SARIF
        if: always() && hashFiles('lib/build/reports/detekt/jsMainSourceSet.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: lib/build/reports/detekt/jsMainSourceSet.sarif
          category: detekt-library

      - name: Fail on Detekt findings
        if: steps.detekt.outcome == 'failure'
        run: exit 1
